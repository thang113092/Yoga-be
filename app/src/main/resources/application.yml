server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  config:
    import: "optional:file:./backend/application-local.properties,optional:file:./application-local.properties,optional:file:../application-local.properties"
  application:
    name: yoga-management-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${YOGA_DB_JDBC_URL}
    username: ${YOGA_DB_USERNAME}
    password: ${YOGA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: YogaHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: yoga
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.company.yoga: DEBUG

yoga:
  payments:
    link-ttl-minutes: ${YOGA_PAYMENT_LINK_TTL_MINUTES:15}
    reconcile-delay-ms: ${YOGA_PAYMENT_RECONCILE_DELAY_MS:120000}
    # PayOS opens this page after payment; status is always read from the backend.
    return-url: ${YOGA_PAYMENT_RETURN_URL:http://localhost:4200/membership/pos}
    payos:
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}

supabase:
  url: ${SUPABASE_URL:https://cagwkxiccmayrtajwdtc.supabase.co}
  publishable-key: ${SUPABASE_PUBLISHABLE_KEY:sb_publishable_Zxasgx3qbMKuwMgN8gObXg_0cZmM0PV}
