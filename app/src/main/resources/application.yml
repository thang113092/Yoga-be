server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  config:
    import: "optional:file:./backend/application-local.properties,optional:file:./application-local.properties,optional:file:../application-local.properties"
  application:
    name: yoga-management-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${YOGA_DB_JDBC_URL}
    username: ${YOGA_DB_USERNAME}
    password: ${YOGA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: YogaHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: yoga
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.company.yoga: DEBUG

yoga:
  payments:
    link-ttl-minutes: ${YOGA_PAYMENT_LINK_TTL_MINUTES:15}
    reconcile-delay-ms: ${YOGA_PAYMENT_RECONCILE_DELAY_MS:120000}
    # PayOS opens this page after payment; status is always read from the backend.
    return-url: ${YOGA_PAYMENT_RETURN_URL:http://localhost:4200/membership/pos}
    payos:
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
  online:
    # Học viên vào lớp từ N phút trước giờ học (tối đa 30, theo validate_checkin).
    join-window-minutes: ${YOGA_ONLINE_JOIN_WINDOW_MINUTES:15}
    sync-delay-ms: ${YOGA_ONLINE_SYNC_DELAY_MS:30000}
    zoom:
      api-base-url: ${ZOOM_API_BASE_URL:https://api.zoom.us/v2}
      oauth-url: ${ZOOM_OAUTH_URL:https://zoom.us/oauth/token}
      # Server-to-Server OAuth app. Để trống thì tắt lớp online (đặt chỗ vẫn chạy, chưa vào lớp được).
      account-id: ${ZOOM_ACCOUNT_ID:}
      client-id: ${ZOOM_CLIENT_ID:}
      client-secret: ${ZOOM_CLIENT_SECRET:}
      webhook-secret: ${ZOOM_WEBHOOK_SECRET:}
      # Host khi phòng ảo chưa khai báo tài khoản Zoom riêng.
      default-host: ${ZOOM_DEFAULT_HOST:me}
      # true: link riêng từng học viên (cần Zoom Pro trở lên). false: link chung của phòng, dùng để thử với Zoom Basic.
      use-registration: ${ZOOM_USE_REGISTRATION:true}
      # Email giả cho registrant (Zoom bắt buộc email; không gửi thư).
      registrant-email-domain: ${ZOOM_REGISTRANT_EMAIL_DOMAIN:students.anyen.invalid}

