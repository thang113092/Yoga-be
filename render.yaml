services:
  - type: web
    name: yoga-management-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: YOGA_DB_JDBC_URL
        sync: false
      - key: YOGA_DB_USERNAME
        sync: false
      - key: YOGA_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: YOGA_CORS_ORIGINS
        sync: false
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: YOGA_PAYMENT_RETURN_URL
        sync: false
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_WEBHOOK_SECRET
        sync: false
      - key: ZOOM_DEFAULT_HOST
        sync: false
      - key: ZOOM_USE_REGISTRATION
        sync: false
