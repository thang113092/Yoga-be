server:
  port: 8080
  shutdown: graceful

spring:
  config:
    import: "optional:file:./backend/application-local.properties,optional:file:./application-local.properties,optional:file:../application-local.properties"
  application:
    name: yoga-management-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${YOGA_DB_JDBC_URL}
    username: ${YOGA_DB_USERNAME}
    password: ${YOGA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: YogaHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: yoga
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.company.yoga: DEBUG

supabase:
  url: ${SUPABASE_URL:https://cagwkxiccmayrtajwdtc.supabase.co}
