server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  config:
    import: "optional:file:./backend/application-local.properties,optional:file:./application-local.properties,optional:file:../application-local.properties"
  application:
    name: yoga-management-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${YOGA_DB_JDBC_URL}
    username: ${YOGA_DB_USERNAME}
    password: ${YOGA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: YogaHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: yoga
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.company.yoga: DEBUG

yoga:
  payments:
    link-ttl-minutes: ${YOGA_PAYMENT_LINK_TTL_MINUTES:15}
    reconcile-delay-ms: ${YOGA_PAYMENT_RECONCILE_DELAY_MS:30000}
    # While a QR screen is open, its status polls also ask PayOS at most this often per code (0 = off),
    # so a payment is confirmed even when the webhook never arrives.
    poll-gateway-interval-seconds: ${YOGA_PAYMENT_POLL_GATEWAY_SECONDS:10}
    # PayOS opens this page after payment; status is always read from the backend.
    return-url: ${YOGA_PAYMENT_RETURN_URL:http://localhost:4300/membership/pos}
    # Same, for students paying their own order online.
    student-return-url: ${YOGA_PAYMENT_STUDENT_RETURN_URL:http://localhost:4300/membership/plans}
    student-course-return-url: ${YOGA_PAYMENT_STUDENT_COURSE_RETURN_URL:http://localhost:4300/schedule/courses}
    payos:
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
  online:
    # Học viên vào lớp từ N phút trước giờ học (tối đa 30, theo validate_checkin).
    join-window-minutes: ${YOGA_ONLINE_JOIN_WINDOW_MINUTES:15}
    sync-delay-ms: ${YOGA_ONLINE_SYNC_DELAY_MS:30000}
    zoom:
      api-base-url: ${ZOOM_API_BASE_URL:https://api.zoom.us/v2}
      oauth-url: ${ZOOM_OAUTH_URL:https://zoom.us/oauth/token}
      # Server-to-Server OAuth app. Để trống thì tắt lớp online (đặt chỗ vẫn chạy, chưa vào lớp được).
      account-id: ${ZOOM_ACCOUNT_ID:}
      client-id: ${ZOOM_CLIENT_ID:}
      client-secret: ${ZOOM_CLIENT_SECRET:}
      webhook-secret: ${ZOOM_WEBHOOK_SECRET:}
      # Host khi phòng ảo chưa khai báo tài khoản Zoom riêng.
      default-host: ${ZOOM_DEFAULT_HOST:me}
      # true: link riêng từng học viên (cần Zoom Pro trở lên). false: link chung của phòng, dùng để thử với Zoom Basic.
      use-registration: ${ZOOM_USE_REGISTRATION:true}
      # Email giả cho registrant (Zoom bắt buộc email; không gửi thư).
      registrant-email-domain: ${ZOOM_REGISTRANT_EMAIL_DOMAIN:students.anyen.invalid}
  notifications:
    # Tạo nhắc gia hạn/khóa học sắp bắt đầu mỗi giờ (chống trùng trong database).
    delay-ms: ${YOGA_NOTIFICATIONS_DELAY_MS:3600000}
    initial-delay-ms: ${YOGA_NOTIFICATIONS_INITIAL_DELAY_MS:60000}
  content:
    # Số thiết bị xem video cùng lúc của một học viên.
    max-devices: ${YOGA_CONTENT_MAX_DEVICES:2}
    # URL trình phát có chữ ký hết hạn sau N phút.
    playback-token-minutes: ${YOGA_CONTENT_PLAYBACK_TOKEN_MINUTES:120}
    # Trình phát gửi tiến độ mỗi N giây; phiên xem hết hạn sau 3 nhịp không gửi.
    heartbeat-seconds: ${YOGA_CONTENT_HEARTBEAT_SECONDS:60}
    # Đổi phiên bản khi sửa nội dung cam kết an toàn.
    waiver-version: ${YOGA_CONTENT_WAIVER_VERSION:2026-11}
    sync-delay-ms: ${YOGA_CONTENT_SYNC_DELAY_MS:60000}
    # Nhập bản ghi buổi live (Zoom cloud) vào Bunny: chu kỳ job và thời gian chờ trước khi tìm video vừa fetch.
    recording-delay-ms: ${YOGA_CONTENT_RECORDING_DELAY_MS:60000}
    recording-check-seconds: ${YOGA_CONTENT_RECORDING_CHECK_SECONDS:60}
    bunny:
      api-base-url: ${BUNNY_API_BASE_URL:https://video.bunnycdn.com}
      embed-base-url: ${BUNNY_EMBED_BASE_URL:https://iframe.mediadelivery.net}
      tus-endpoint: ${BUNNY_TUS_ENDPOINT:https://video.bunnycdn.com/tusupload}
      # Thư viện Bunny Stream. Để trống thì tắt thư viện video (quản lý nội dung vẫn tạo bản nháp được).
      library-id: ${BUNNY_LIBRARY_ID:}
      api-key: ${BUNNY_API_KEY:}
      # Khóa "Embed view token authentication" của thư viện: ký URL trình phát.
      token-key: ${BUNNY_TOKEN_KEY:}
      # Pull zone của thư viện (vz-xxxx.b-cdn.net) để lấy ảnh thu nhỏ.
      cdn-hostname: ${BUNNY_CDN_HOSTNAME:}
      # Bí mật trong URL webhook: https://<backend>/api/v1/integration-webhooks/bunny?token=<bí mật>
      webhook-secret: ${BUNNY_WEBHOOK_SECRET:}
  # Tính năng AI (AI_INTEGRATION_PLAN.md). Tắt thì hệ thống vẫn chạy đủ, chỉ ẩn các nút AI.
  # Bật mà thiếu khóa, hoặc tính năng có mô hình mà thiếu giá, thì ứng dụng không khởi động.
  ai:
    enabled: ${YOGA_AI_ENABLED:false}
    provider: ${YOGA_AI_PROVIDER:gemini}
    gemini:
      # Khóa Gemini API gói TRẢ PHÍ (gói miễn phí cho phép Google dùng dữ liệu gửi lên). Không đưa khóa thật vào Git.
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-seconds: ${YOGA_AI_TIMEOUT_SECONDS:60}
      # Thử lại khi Gemini quá tải (429) hoặc lỗi 5xx.
      max-retries: ${YOGA_AI_MAX_RETRIES:2}
    features:
      # Gợi ý chủ đề/cấp độ/mô tả/lưu ý an toàn cho video. Để trống model thì tắt riêng tính năng này.
      # Chỉ dùng mô hình ổn định (không preview/exp); đổi mô hình hoặc prompt thì chạy lại bộ mẫu đánh giá.
      video-tagging:
        model: ${YOGA_AI_TAGGING_MODEL:}
        max-output-tokens: ${YOGA_AI_TAGGING_MAX_OUTPUT:2048}
        # Chỉ gửi khi đặt giá trị; dùng thinking-level hoặc thinking-budget tùy mô hình hỗ trợ.
        thinking-level: ${YOGA_AI_TAGGING_THINKING_LEVEL:}
        thinking-budget: ${YOGA_AI_TAGGING_THINKING_BUDGET:}
        # Giá USD cho 1 triệu token theo bảng giá Google của đúng mô hình trên. Bắt buộc khi có model.
        price-input: ${YOGA_AI_TAGGING_PRICE_INPUT:}
        price-cached-input: ${YOGA_AI_TAGGING_PRICE_CACHED_INPUT:}
        price-output: ${YOGA_AI_TAGGING_PRICE_OUTPUT:}
    quota:
      student-requests-per-day: ${YOGA_AI_STUDENT_DAILY_REQUESTS:30}
      staff-requests-per-day: ${YOGA_AI_STAFF_DAILY_REQUESTS:100}
      # Trần chi phí toàn hệ thống mỗi ngày (giờ VN), USD; vượt thì tạm dừng AI đến 0h. 0 = không giới hạn.
      daily-budget-usd: ${YOGA_AI_DAILY_BUDGET_USD:20}
      alert-percent: ${YOGA_AI_BUDGET_ALERT_PERCENT:80}

